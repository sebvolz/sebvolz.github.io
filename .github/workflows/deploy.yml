# Builds the CV PDF and the Jekyll site, then publishes them to GitHub Pages.
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cv:
    runs-on: ubuntu-latest
    # Same TeX Live image as `make cv` locally
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile CV
        working-directory: cv
        run: latexmk -lualatex -interaction=nonstopmode -halt-on-error -outdir=build cv.tex
      - uses: actions/upload-artifact@v4
        with:
          name: cv
          path: cv/build/cv.pdf

  site:
    needs: cv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cv
          path: files
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
